name: Daily TOEIC Study Result

on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Optional KST date to generate (YYYY-MM-DD)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-toeic-study
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
      RUN_DATE: ${{ github.event_name == 'workflow_dispatch' && inputs.date || '' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate daily result
        run: python scripts/generate_daily_toeic.py --date "$RUN_DATE"

      - name: Commit generated result
        shell: bash
        run: |
          REPORT_DATE="${RUN_DATE:-$(TZ=Asia/Seoul date +%F)}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports data
          if git diff --cached --quiet; then
            echo "No new TOEIC result to commit."
          else
            git commit -m "Add TOEIC daily result ${REPORT_DATE}"
            git push
          fi
